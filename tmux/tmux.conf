# tmux defaults, linked to ~/.tmux.conf by install.sh.
# Edit this file in the repo, not ~/.tmux.conf (it's the same file anyway).

# --- Terminal / colors ---------------------------------------------------
set -g default-terminal "tmux-256color"
# Advertise truecolor for common $TERM values so colors aren't washed out.
set -ga terminal-overrides ",xterm-256color:Tc,*256col*:Tc,screen*:Tc"

# --- Mouse & scrollback --------------------------------------------------
set -g mouse on                 # wheel scroll, click to select pane/window
set -g history-limit 50000      # large scrollback buffer

# --- Usability -----------------------------------------------------------
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes start at 1
set -g renumber-windows on      # keep window numbers gapless
set -sg escape-time 10          # snappier ESC (avoids vi/editor lag)
set -g focus-events on          # let editors know when a pane gains focus
set -g set-clipboard on         # integrate with the system clipboard (OSC 52)

# Bigger, clearer status/message timeouts
set -g display-time 2000
set -g status-interval 5

# --- Copy mode: vi keys + wheel exits at bottom --------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Reload convenience --------------------------------------------------
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
